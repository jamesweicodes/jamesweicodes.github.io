<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Script Generator | James Wei Lab</title>
    <meta name="description" content="Generate high-converting real estate listing copy and social posts. A Lab demo by James Wei.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23020617'/><text x='16' y='22' text-anchor='middle' fill='%2322d3ee' font-family='system-ui' font-weight='700' font-size='14'>JW</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/site.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: { 400: '#22d3ee', 500: '#06b6d4' }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-brand-500 selection:text-white min-h-screen">

    <nav class="border-b border-slate-800/50 glass-card rounded-none no-hover">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="font-display font-bold text-xl tracking-tighter hover:text-brand-400 transition-colors">JW.</a>
            <a href="/#lab" class="text-sm text-slate-400 hover:text-brand-400 transition-colors">← Back to Lab</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <header class="mb-10">
            <p class="text-brand-400 text-xs font-semibold tracking-widest uppercase mb-2">The Lab / Demo</p>
            <h1 class="text-3xl md:text-4xl font-display font-bold text-white mb-3">Real Estate Script Generator</h1>
            <p class="text-slate-400 max-w-2xl">Generate listing copy and social post variants for real estate professionals. Template-based — no API key required.</p>
        </header>

        <form id="generator-form" class="glass-card p-6 md:p-8 rounded-2xl mb-8 space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="property-type" class="block text-sm font-medium text-slate-300 mb-2">Property Type</label>
                    <select id="property-type" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50">
                        <option value="Single-Family Home">Single-Family Home</option>
                        <option value="Condo">Condo</option>
                        <option value="Townhouse">Townhouse</option>
                        <option value="Multi-Family">Multi-Family</option>
                        <option value="Luxury Estate">Luxury Estate</option>
                    </select>
                </div>
                <div>
                    <label for="location" class="block text-sm font-medium text-slate-300 mb-2">Location</label>
                    <input id="location" type="text" placeholder="e.g. San Jose, CA" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50 placeholder:text-slate-500" required />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="beds" class="block text-sm font-medium text-slate-300 mb-2">Bedrooms / Baths</label>
                    <input id="beds" type="text" placeholder="e.g. 4 bed / 3 bath" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50 placeholder:text-slate-500" />
                </div>
                <div>
                    <label for="price" class="block text-sm font-medium text-slate-300 mb-2">Price Point</label>
                    <input id="price" type="text" placeholder="e.g. $1.2M" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50 placeholder:text-slate-500" />
                </div>
            </div>

            <div>
                <label for="tone" class="block text-sm font-medium text-slate-300 mb-2">Tone</label>
                <select id="tone" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50">
                    <option value="professional">Professional</option>
                    <option value="casual">Casual & Friendly</option>
                    <option value="luxury">Luxury & Aspirational</option>
                </select>
            </div>

            <div>
                <label for="highlights" class="block text-sm font-medium text-slate-300 mb-2">Key Selling Points</label>
                <textarea id="highlights" rows="3" placeholder="e.g. Updated kitchen, large backyard, top-rated schools, near Caltrain..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500/50 placeholder:text-slate-500 resize-none"></textarea>
            </div>

            <button type="submit" class="w-full md:w-auto px-8 py-3 text-sm font-medium rounded-lg bg-brand-500 text-slate-950 hover:bg-brand-400 transition-all shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                Generate Copy
            </button>
        </form>

        <div id="output-section" class="hidden space-y-6">
            <div class="glass-card p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-display font-bold text-white">Listing Description</h2>
                    <button type="button" data-copy="listing" class="copy-btn text-xs text-brand-400 hover:text-brand-300 font-medium px-3 py-1 rounded-lg border border-brand-500/30 hover:border-brand-500/50 transition-colors">Copy</button>
                </div>
                <p id="output-listing" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-display font-bold text-white">Instagram / Facebook Post</h2>
                    <button type="button" data-copy="social" class="copy-btn text-xs text-brand-400 hover:text-brand-300 font-medium px-3 py-1 rounded-lg border border-brand-500/30 hover:border-brand-500/50 transition-colors">Copy</button>
                </div>
                <p id="output-social" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"></p>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-display font-bold text-white">Short Hook (Stories / Reels)</h2>
                    <button type="button" data-copy="hook" class="copy-btn text-xs text-brand-400 hover:text-brand-300 font-medium px-3 py-1 rounded-lg border border-brand-500/30 hover:border-brand-500/50 transition-colors">Copy</button>
                </div>
                <p id="output-hook" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"></p>
            </div>
        </div>

        <section id="history-section" class="mt-12 hidden">
            <h2 class="text-xl font-display font-bold text-white mb-4">Recent Generations</h2>
            <div id="history-list" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const STORAGE_KEY = 'jw-script-generator-history';
        const MAX_HISTORY = 3;

        const toneOpeners = {
            professional: ['Presenting', 'Now available', 'A exceptional opportunity awaits with'],
            casual: ['You\'re going to love', 'Check out this gem', 'Just listed and ready for you'],
            luxury: ['An exquisite', 'Discover unparalleled elegance in this', 'Experience refined living in this stunning']
        };

        const toneClosers = {
            professional: 'Schedule a private showing today to experience this property firsthand.',
            casual: 'DM me for a tour — this one won\'t last long!',
            luxury: 'Exclusive showings available by appointment for discerning buyers.'
        };

        function generateCopy(data) {
            const opener = toneOpeners[data.tone][Math.floor(Math.random() * toneOpeners[data.tone].length)];
            const closer = toneClosers[data.tone];
            const highlights = data.highlights
                ? data.highlights.split(/[,;\n]+/).map(h => h.trim()).filter(Boolean)
                : [];

            const details = [
                data.beds ? data.beds : null,
                data.price ? `Listed at ${data.price}` : null
            ].filter(Boolean).join(' · ');

            const highlightText = highlights.length
                ? '\n\nHighlights include ' + highlights.join(', ') + '.'
                : '';

            const listing = `${opener} this ${data.propertyType.toLowerCase()} in ${data.location}.${details ? ' ' + details + '.' : ''}${highlightText}\n\n${closer}`;

            const hashtags = ['#RealEstate', '#JustListed', '#' + data.location.replace(/[^a-zA-Z0-9]/g, ''), '#HomeForSale'];
            const social = `🏡 JUST LISTED in ${data.location}!\n\n${data.propertyType}${data.beds ? ' · ' + data.beds : ''}${data.price ? ' · ' + data.price : ''}\n\n${highlights.slice(0, 3).join(' ✓ ') || 'Move-in ready and waiting for you.'}\n\n${closer}\n\n${hashtags.join(' ')}`;

            const hook = data.price
                ? `${data.price} in ${data.location}? Here's why buyers are calling. 👀`
                : `New listing alert: ${data.propertyType} in ${data.location}. Tap for details.`;

            return { listing, social, hook };
        }

        function saveHistory(entry) {
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            history.unshift({ ...entry, timestamp: Date.now() });
            history = history.slice(0, MAX_HISTORY);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const section = document.getElementById('history-section');
            const list = document.getElementById('history-list');

            if (!history.length) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            list.innerHTML = history.map((item, i) => {
                const date = new Date(item.timestamp).toLocaleDateString();
                return `<button type="button" data-history="${i}" class="w-full text-left glass-card p-4 rounded-xl hover:border-brand-500/30 transition-colors">
                    <span class="text-xs text-slate-500">${date}</span>
                    <p class="text-sm text-slate-300 mt-1 truncate">${item.propertyType} — ${item.location}</p>
                </button>`;
            }).join('');

            list.querySelectorAll('[data-history]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = history[parseInt(btn.dataset.history)];
                    showOutput(item.outputs);
                });
            });
        }

        function showOutput(outputs) {
            document.getElementById('output-listing').textContent = outputs.listing;
            document.getElementById('output-social').textContent = outputs.social;
            document.getElementById('output-hook').textContent = outputs.hook;
            document.getElementById('output-section').classList.remove('hidden');
            window.__lastOutputs = outputs;
        }

        document.getElementById('generator-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const data = {
                propertyType: document.getElementById('property-type').value,
                location: document.getElementById('location').value.trim(),
                beds: document.getElementById('beds').value.trim(),
                price: document.getElementById('price').value.trim(),
                tone: document.getElementById('tone').value,
                highlights: document.getElementById('highlights').value.trim()
            };

            if (!data.location) return;

            const outputs = generateCopy(data);
            showOutput(outputs);
            saveHistory({ ...data, outputs });
        });

        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const key = btn.dataset.copy;
                const map = { listing: 'output-listing', social: 'output-social', hook: 'output-hook' };
                const text = document.getElementById(map[key]).textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
                } catch {
                    btn.textContent = 'Failed';
                    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
                }
            });
        });

        renderHistory();
    </script>
</body>
</html>
