                <h2 class="text-3xl md:text-4xl font-display font-bold mb-12 text-glow reveal">Corporate Scale</h2>
                <div id="experience-list"></div>
            </div>
        </section>

        <section id="lab" class="py-24 px-6 border-t border-slate-800/50 bg-[#0f172a]/40 pointer-events-auto" aria-label="The Lab">

            <a href="/" class="dock-item relative flex items-center justify-center w-12 h-12 rounded-xl bg-white/5 border border-white/10 shadow-lg hover:bg-white/10 transition-colors origin-bottom" title="Home">
                <i data-lucide="home" class="text-slate-300 w-5 h-5 pointer-events-none"></i>

            <a href="#experience" class="dock-item relative flex items-center justify-center w-12 h-12 rounded-xl bg-white/5 border border-white/10 shadow-lg hover:bg-white/10 transition-colors origin-bottom" title="Experience">

            <button id="ai-btn" class="dock-item relative flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500/20 border border-brand-500/40 shadow-[0_0_15px_rgba(34,211,238,0.2)] hover:bg-brand-500/30 transition-colors origin-bottom" title="AI Copilot" aria-label="Open AI Copilot">
                <i data-lucide="sparkles" class="text-brand-400 w-5 h-5 pointer-events-none"></i>
            </button>

        <div class="flex items-center justify-between p-4 border-b border-white/10 bg-white/5">
